[package]
name = "local-content-studio"
version = "0.1.0"
description = "Local Content Studio — a desktop app for short-form video production"
authors = ["you"]
edition = "2021"

[lib]
name = "local_content_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

